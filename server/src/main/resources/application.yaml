ktor:
  deployment:
    port: "$PORT:8080"
    host: 0.0.0.0
  application:
    modules:
      - com.pelypets.todolist.server.ApplicationKt.module

app:
  # "development" (default) or "production". Production refuses to start without a real JWT_SECRET.
  environment: "$APP_ENV:development"
  # Set to true only behind a reverse proxy that sets X-Forwarded-For (e.g. Render), so rate limits see client IPs.
  trustProxy: "$TRUST_PROXY:false"

rateLimit:
  authRequestsPerMinute: "$AUTH_RATE_LIMIT_PER_MINUTE:20"

database:
  url: "$DB_URL:jdbc:postgresql://localhost:5434/todolist"
  user: "$DB_USER:todolist"
  password: "$DB_PASSWORD:todolist"
  maxPoolSize: 10

jwt:
  # Required in production (at least 32 characters). Without it, development uses a built-in key.
  secret: "$?JWT_SECRET"
  issuer: "todolist-server"
  audience: "todolist-clients"
  realm: "todolist"
  accessTokenTtlSeconds: 900
  refreshTokenTtlDays: 30

google:
  # Comma-separated OAuth client IDs (web, android, ios) accepted as the ID token audience.
  clientIds: "$GOOGLE_CLIENT_IDS:942997837259-p5avn0h84otleksfs47cnbrr7gs52t2c.apps.googleusercontent.com,942997837259-56nldcuks4gmmaju4hvr15ttik6ra6h7.apps.googleusercontent.com"
