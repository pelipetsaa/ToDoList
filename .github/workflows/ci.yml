name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  quality:
    name: Formatting and Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # ktlint (with Compose rules) through Spotless; fix locally with ./gradlew spotlessApply.
      - run: ./gradlew spotlessCheck :app:androidApp:lintDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/androidApp/build/reports/lint-results-debug.html

  server:
    name: Server and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers starts PostgreSQL through the runner's Docker daemon.
      - run: ./gradlew :core:jvmTest :server:test :server:koverHtmlReport :server:koverLog | tee gradle.log
      - name: Coverage summary
        run: |
          grep -h "line coverage" gradle.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/build/reports/kover/html
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            server/build/reports/tests
            core/build/reports/tests

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same image Render builds on deploy.
      - run: docker build -t todolist-server .

  android:
    name: Shared tests and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The release build runs R8, so minification problems surface here rather than in a release.
      - run: >
          ./gradlew
          :app:domain:testAndroidHostTest
          :app:data:testAndroidHostTest
          :app:shared:testAndroidHostTest
          :app:domain:koverLog :app:data:koverLog :app:shared:koverLog
          :app:androidApp:assembleDebug
          :app:androidApp:assembleRelease
          | tee gradle.log
      - name: Coverage summary
        run: |
          grep -h "line coverage" gradle.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/*/build/reports/tests

  ios:
    name: iOS framework and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: >
          ./gradlew
          :app:domain:iosSimulatorArm64Test
          :app:data:iosSimulatorArm64Test
          :app:shared:iosSimulatorArm64Test
          :app:shared:linkDebugFrameworkIosSimulatorArm64
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: app/*/build/reports/tests
