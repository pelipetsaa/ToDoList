name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  server:
    name: Server and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers starts PostgreSQL through the runner's Docker daemon.
      - run: ./gradlew :core:jvmTest :server:test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            server/build/reports/tests
            core/build/reports/tests

  android:
    name: Shared tests and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :app:domain:testAndroidHostTest
          :app:data:testAndroidHostTest
          :app:shared:testAndroidHostTest
          :app:androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/*/build/reports/tests

  ios:
    name: iOS framework and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: >
          ./gradlew
          :app:domain:iosSimulatorArm64Test
          :app:data:iosSimulatorArm64Test
          :app:shared:iosSimulatorArm64Test
          :app:shared:linkDebugFrameworkIosSimulatorArm64
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: app/*/build/reports/tests
