name: Release

# Push a tag like v1.2.0 to build a signed Android release and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, see docs/release.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build APK and App Bundle
        # The server address comes from todolist.releaseApiBaseUrl in gradle.properties.
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:androidApp:assembleRelease :app:androidApp:bundleRelease
          -Ptodolist.versionCode=${{ github.run_number }}
          -Ptodolist.versionName="${GITHUB_REF_NAME#v}"
          -Ptodolist.signing.storeFile="$RUNNER_TEMP/release.jks"
          -Ptodolist.signing.storePassword="$STORE_PASSWORD"
          -Ptodolist.signing.keyAlias="$KEY_ALIAS"
          -Ptodolist.signing.keyPassword="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/androidApp/build/outputs/apk/release/*.apk
            app/androidApp/build/outputs/bundle/release/*.aab
            app/androidApp/build/outputs/mapping/release/mapping.txt

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          app/androidApp/build/outputs/apk/release/androidApp-release.apk
