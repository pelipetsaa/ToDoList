# Render Blueprint for the backend: https://render.com/docs/blueprint-spec
# Setup steps are in docs/deploy.md. The database lives on Neon (Render's free Postgres expires after 30 days).
services:
  - type: web
    name: todolist-server
    runtime: docker
    plan: free
    # Same AWS region as the Neon database (us-east-2); Render cannot change it after creation.
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy a commit on main only after the GitHub Actions CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      # Render terminates TLS and appends the client IP to X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Neon direct (non-pooler) endpoint, e.g. jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
